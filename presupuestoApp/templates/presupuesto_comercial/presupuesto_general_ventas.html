{% extends "presupuesto_comercial/base_presupuesto_comercial.html" %}
{% load static %}

{% block content %}
<div class="bloque-vista">
    <h2>📊 Proyección presupuesto general - Ventas</h2>

    <div class="btn-group">
        <button type="button" id="exportarBtn" class="pt-btn secondary">📥 Exportar a Excel</button>
    </div>

    <div id="tablaGeneralVentas"></div>
</div>
{% endblock %}

{% block js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const GROUP_FIELDS = ['year'];
    const EXTRA_FIELDS = ['total_year', 'total_year_costos', 'variacion_valor', 'variacion_pct',
                           'utilidad_pct', 'utilidad_valor', 'total_proyectado'];
    const ANIO_ACTUAL = new Date().getFullYear();
    const ANIO_SIGUIENTE = ANIO_ACTUAL + 1;

    // Inserta, tras el año siguiente, dos filas informativas de margen
    // (equivalente a las filas "R2"/"Margen" que el código original
    // añadía manualmente sobre el resultado de DataTables).
    function pivotConMargen(data) {
        const filas = PresupuestoUtils.pivotByMonth(data, GROUP_FIELDS, EXTRA_FIELDS)
            .sort((a, b) => a.year - b.year);

        const filaActual = filas.find(f => f.year === ANIO_ACTUAL);
        const idxSiguiente = filas.findIndex(f => f.year === ANIO_SIGUIENTE);
        if (idxSiguiente === -1 || !filaActual) return filas;

        const filaSiguiente = filas[idxSiguiente];
        const ventas = filaActual.total_year || 0;
        const costos = filaActual.total_year_costos || 0;
        const margenAnual = ventas > 0 ? 1 - (costos / ventas) : 0;

        const filaPct = { year: 'Margen % ' + ANIO_ACTUAL, total_year: margenAnual * 100 };
        const filaValor = { year: 'Utilidad Valor ' + ANIO_SIGUIENTE, total_year: Math.round((filaSiguiente.total_year || 0) * margenAnual) };
        PresupuestoUtils.columnasMeses().forEach(c => {
            const registro = data.find(r => r.year === ANIO_SIGUIENTE && parseInt(r.mes, 10) === (['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'].indexOf(c.key) + 1));
            filaPct[c.key] = registro ? registro.utilidad_pct : null;
            filaValor[c.key] = registro ? registro.utilidad_valor : null;
        });

        filas.splice(idxSiguiente + 1, 0, filaPct, filaValor);
        return filas;
    }

    const tabla = new PresupuestoTable({
        container: 'tablaGeneralVentas',
        exportFileName: 'Presupuesto_General_Ventas',
        emptyMessage: 'No hay datos cargados todavía',
        pivot: pivotConMargen,
        columns: [
            { key: 'year', label: 'Año', type: 'text', filterable: true },
            ...PresupuestoUtils.columnasMeses(),
            { key: 'total_year', label: 'Total Año Ventas', type: 'number' },
            { key: 'total_year_costos', label: 'Total Año Costos', type: 'number' },
            { key: 'variacion_valor', label: 'Variación Valor Ventas', type: 'number' },
            { key: 'variacion_pct', label: 'Variación Ventas %', type: 'percent' },
            { key: 'utilidad_pct', label: 'Margen %', type: 'percent' },
            { key: 'utilidad_valor', label: 'Margen Valor', type: 'number' },
            { key: 'total_proyectado', label: 'Total proyectado', type: 'number' },
        ],
    });

    async function cargarDatos() {
        await PresupuestoUtils.conLoader('tablaGeneralVentas', 'Calculando presupuesto general…', async () => {
            const datos = await PresupuestoUtils.getJSON("{% url 'obtener_presupuesto_general_ventas' %}");
            tabla.setData(datos);
        });
    }

    document.getElementById('exportarBtn').addEventListener('click', () => tabla.exportToExcel());

    cargarDatos();
});
</script>
{% endblock %}
