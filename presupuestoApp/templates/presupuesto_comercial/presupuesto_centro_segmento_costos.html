{% extends "presupuesto_comercial/base_presupuesto_comercial.html" %}
{% load static %}

{% block content %}
<div class="bloque-vista">
    <h2>📊 Proyección presupuesto centro operación - segmento - Costos</h2>

    <div class="btn-group">
        <button type="button" id="exportarBtn" class="pt-btn secondary">📥 Exportar a Excel</button>
    </div>

    <div id="tablaCentroSegmentoCostos"></div>
</div>
{% endblock %}

{% block js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const GROUP_FIELDS = ['year', 'segmento', 'nombre_centro_operacion'];
    const EXTRA_FIELDS = ['total_year', 'variacion_valor', 'variacion_pct'];

    const tabla = new PresupuestoTable({
        container: 'tablaCentroSegmentoCostos',
        exportFileName: 'Presupuesto_Centro_Segmento_Costos',
        emptyMessage: 'No hay datos cargados todavía',
        pivot: (data) => PresupuestoUtils.pivotByMonth(data, GROUP_FIELDS, EXTRA_FIELDS),
        columns: [
            { key: 'year', label: 'Año', type: 'text', filterable: true },
            { key: 'segmento', label: 'Segmento', type: 'text', filterable: true },
            { key: 'nombre_centro_operacion', label: 'Centro de operación', type: 'text', filterable: true },
            ...PresupuestoUtils.columnasMeses(),
            { key: 'total_year', label: 'Total Año', type: 'number' },
            { key: 'variacion_valor', label: 'Variación Valor', type: 'number' },
            { key: 'variacion_pct', label: 'Variación %', type: 'percent' },
        ],
    });

    async function cargarDatos() {
        await PresupuestoUtils.conLoader('tablaCentroSegmentoCostos', 'Calculando costos por segmento…', async () => {
            const datos = await PresupuestoUtils.getJSON("{% url 'obtener_presupuesto_centro_segmento_costos' %}");
            tabla.setData(datos);
        });
    }

    document.getElementById('exportarBtn').addEventListener('click', () => tabla.exportToExcel());

    cargarDatos();
});
</script>
{% endblock %}
