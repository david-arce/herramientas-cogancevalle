{% extends "presupuesto_comercial/base_presupuesto_comercial.html" %}
{% load static %}{% load estaticos %}

{% block css %}
<meta name="csrf-token" content="{{ csrf_token }}">
{% endblock %}

{% block content %}
<div class="bloque-vista">
    <h2>📊 Proyección presupuesto general</h2>

    <div class="btn-group">
        <input type="file" id="excelUpload" accept=".xlsx,.xls" style="display:none;">
        <button type="button" id="uploadExcelBtn" class="pt-btn">📤 Subir Excel</button>
        <button type="button" id="exportarBaseBtn" class="pt-btn secondary">📤 Exportar base Año Actual</button>
        <button type="button" id="exportarExcelBtn" class="pt-btn secondary">📥 Exportar a Excel Esta Tabla</button>
        <button type="button" id="colvisBtn" class="pt-btn secondary">👁️ Mostrar / ocultar columnas</button>
        <span id="autosaveStatus" class="pt-autosave-status" aria-live="polite"></span>
        <span id="ventasStatus" class="pt-autosave-status" aria-live="polite"></span>
    </div>

    <div id="tablaComercial"></div>
</div>
{% endblock %}

{% block js %}
<script src="{% static_v 'js/envio_seguro.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const ANIO_ACTUAL = new Date().getFullYear();

    // Recalcula proyección y utilidad cuando se edita "crecimiento_ventas"
    // o "crecimiento_costos" (antes vivía embebido en 100+ líneas de
    // callbacks de DataTables).
    function onEdit(row, key, valor) {
        if (key !== 'crecimiento_ventas') return;

        const base = parseFloat(row.ventas) || 0;
        row.proyeccion_ventas = Math.round(base + base * (valor / 100));

        // El costo proyectado ya no es editable: se toma el costo real
        // del año actual como referencia para el margen.
        const costos = parseFloat(row.costos) || 0;
        const utilidadValor = row.proyeccion_ventas - costos;
        const utilidadPct = row.proyeccion_ventas ? (utilidadValor / row.proyeccion_ventas) * 100 : 0;

        row.utilidad_valor = Math.round(utilidadValor);
        row.utilidad_porcentual = Number(utilidadPct.toFixed(2));
        row.variacion_proyectada_valor = Math.round(utilidadValor - (row.utilidad_valor_actual || 0));
        row.variacion_proyectada_porcentual = Number((utilidadPct - (row.utilidad_porcentual_actual || 0)).toFixed(2));
    }

    const soloAnioActual = (row) => Number(row.year) === ANIO_ACTUAL;

    // ------------------------------------------------------------------
    // Autoguardado — mismas reglas que las grillas de presupuesto
    // (envio_seguro.js):
    //   · solo se envían las filas que cambiaron (antes iba la tabla completa
    //     y el guardado tardaba tanto que se quedaba en "Guardando…");
    //   · un solo envío a la vez y siempre la versión más reciente;
    //   · copia en este navegador + reintentos si el servidor no responde
    //     (p. ej. durante una actualización de la aplicación);
    //   · el estado siempre termina en "Guardado HH:MM", "reintentando…" o
    //     un error claro; si quedó algo sin guardar, al volver se ofrece recuperarlo.
    // ------------------------------------------------------------------
    const URL_GUARDAR = "{% url 'guardar_presupuesto_comercial' %}";
    const URL_GENERAR_VENTAS = "{% url 'generar_presupuesto_ventas' %}";
    const CLAVE_RESPALDO = 'comercial|{{ request.user.username|escapejs }}|' + ANIO_ACTUAL;
    const DEBOUNCE_MS = 900;
    const VENTAS_ESPERA_MS = 4000;    // tras la última edición guardada, se recalcula el presupuesto de ventas

    const statusEl = document.getElementById('autosaveStatus');
    const ventasEl = document.getElementById('ventasStatus');
    function mostrarEstado(texto, clase) {
        statusEl.textContent = texto;
        statusEl.className = 'pt-autosave-status' + (clase ? ' ' + clase : '');
    }
    function estadoVentas(texto, clase, detalle) {
        ventasEl.textContent = texto;
        ventasEl.title = detalle || '';
        ventasEl.className = 'pt-autosave-status' + (clase ? ' ' + clase : '');
    }
    const hora = () => new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    const claveFila = r => [r.linea, r.nombre_centro_de_operacion || '', r.nombre_clase_cliente || ''].join('|');
    const filaMinima = r => ({
        linea: r.linea, year: r.year,
        nombre_centro_de_operacion: r.nombre_centro_de_operacion || '',
        nombre_clase_cliente: r.nombre_clase_cliente || '',
        crecimiento_ventas: Number(r.crecimiento_ventas) || 0,
    });

    const pendientes = new Map();   // claveFila -> fila mínima aún no confirmada
    let ultimoEnvio = new Map();    // lo que se puso en la cola la última vez
    let debounceTimer = null;
    let huboCambiosReales = false;  // algún envío confirmado cambió un crecimiento

    const cola = EnvioSeguro.cola({
        clave: CLAVE_RESPALDO,
        url: URL_GUARDAR,
        esExito: j => j.status === 'ok',
        onEstado(estado, info) {
            if (estado === 'enviando') {
                mostrarEstado('💾 Guardando…', 'guardando');
            } else if (estado === 'enviado') {
                if ((info.respuesta && info.respuesta.cambios) > 0) huboCambiosReales = true;
            } else if (estado === 'guardado') {
                // Se quitan de "pendientes" solo los valores que viajaron en ese envío
                // (si el usuario editó otra vez mientras tanto, eso sigue pendiente).
                ultimoEnvio.forEach((fila, k) => {
                    const actual = pendientes.get(k);
                    if (actual && actual.crecimiento_ventas === fila.crecimiento_ventas) pendientes.delete(k);
                });
                if (!debounceTimer && pendientes.size === 0) mostrarEstado(`✅ Guardado ${hora()}`, 'guardado');
                if (huboCambiosReales) { huboCambiosReales = false; programarVentas(); }
            } else if (estado === 'reintentando') {
                const seg = Math.round(info.espera / 1000);
                mostrarEstado(info.conRespaldo
                    ? `⏳ Servidor no disponible · reintento en ${seg} s · cambios a salvo en este navegador`
                    : `⏳ Servidor no disponible · reintento en ${seg} s · no cierres esta página`, 'editando');
            } else if (estado === 'error') {
                mostrarEstado('❌ No se guardó: ' + info.error.message, 'error');
            }
        },
    });

    function encolar() {
        debounceTimer = null;
        if (!pendientes.size) return;
        ultimoEnvio = new Map(Array.from(pendientes, ([k, f]) => [k, { ...f }]));
        cola.poner(Array.from(pendientes.values()));
    }

    function onChange(row) {
        if (!soloAnioActual(row)) return;
        pendientes.set(claveFila(row), filaMinima(row));
        mostrarEstado('✏️ Cambios sin guardar…', 'editando');
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(encolar, DEBOUNCE_MS);
    }

    // ── Presupuesto de ventas (cuentas 1, 2, 41750201): se recalcula SOLO
    //    cuando cambian los crecimientos de esta tabla (edición o Excel). ──
    let ventasTimer = null, ventasPendiente = false, ventasCorriendo = false, ventasVersion = 0;

    function programarVentas(esperaMs = VENTAS_ESPERA_MS) {
        ventasPendiente = true;
        ventasVersion += 1;
        clearTimeout(ventasTimer);
        estadoVentas('📈 El presupuesto de ventas se actualizará en unos segundos…', 'editando');
        ventasTimer = setTimeout(generarVentas, esperaMs);
    }

    async function generarVentas() {
        ventasTimer = null;
        // Primero que termine de guardarse todo lo de la tabla.
        if (debounceTimer || cola.hayPendientes() || ventasCorriendo) {
            ventasTimer = setTimeout(generarVentas, 2000);
            return;
        }
        const version = ventasVersion;
        ventasCorriendo = true;
        estadoVentas('📈 Actualizando presupuesto de ventas…', 'guardando');
        try {
            const r = await EnvioSeguro.enviar(URL_GENERAR_VENTAS, {}, {
                maxEsperaMs: 180000,
                // Se muestra el motivo real (sin conexión, sesión cerrada, el servidor
                // cortó la petición por tiempo, base de datos no disponible...).
                onReintento: ({ error, espera }) => estadoVentas(
                    `⏳ Presupuesto de ventas: ${error.message} · reintento en ${Math.round(espera / 1000)} s`,
                    'editando', error.message),
            });
            const omitidas = Object.entries(r.sedes_omitidas || {});
            if (omitidas.length) {
                estadoVentas(`⚠️ Presupuesto de ventas actualizado ${hora()} · sin actualizar: ${omitidas.map(([s]) => s).join(', ')}`,
                             'error', omitidas.map(([s, m]) => `${s}: ${m}`).join('\n'));
            } else {
                estadoVentas(`✅ Presupuesto de ventas actualizado ${hora()}`, 'guardado');
            }
        } catch (e) {
            estadoVentas('❌ No se actualizó el presupuesto de ventas: ' + e.message, 'error');
        } finally {
            ventasCorriendo = false;
            if (version === ventasVersion) ventasPendiente = false;   // si hubo cambios nuevos, ya hay otro programado
        }
    }

    window.addEventListener('beforeunload', function (e) {
        if (!(debounceTimer || cola.hayPendientes() || ventasPendiente || ventasCorriendo)) return;
        e.preventDefault();
        e.returnValue = '';
    });

    // ── Cambios que no alcanzaron a guardarse (página cerrada o recargada
    //    durante una actualización del sistema / corte de red) ──
    function revisarRespaldo() {
        const respaldo = EnvioSeguro.respaldo(CLAVE_RESPALDO);
        if (!respaldo || !Array.isArray(respaldo.datos) || !respaldo.datos.length) return;
        const filas = new Map(tabla.getRows().filter(soloAnioActual).map(r => [claveFila(r), r]));
        const faltan = respaldo.datos.filter(d => {
            const r = filas.get(claveFila(d));
            return !r || (Number(r.crecimiento_ventas) || 0) !== (Number(d.crecimiento_ventas) || 0);
        });
        if (!faltan.length) { EnvioSeguro.descartar(CLAVE_RESPALDO); return; }   // sí había llegado
        const cuando = new Date(respaldo.ts).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
        const ok = confirm(`El ${cuando} cambiaste ${faltan.length} crecimiento(s) que no alcanzaron a guardarse ` +
                           `(por ejemplo, porque la aplicación se estaba actualizando). Quedaron en este navegador.\n\n` +
                           `¿Recuperarlos y guardarlos ahora?`);
        if (!ok) { EnvioSeguro.descartar(CLAVE_RESPALDO); return; }
        faltan.forEach(d => {
            const r = filas.get(claveFila(d));
            if (!r) return;
            r.crecimiento_ventas = d.crecimiento_ventas;
            onEdit(r, 'crecimiento_ventas', Number(d.crecimiento_ventas) || 0);
            pendientes.set(claveFila(r), filaMinima(r));
        });
        if (typeof tabla._renderBody === 'function') tabla._renderBody(); else tabla.setData(tabla.getRows());
        encolar();
    }

    const tabla = new PresupuestoTable({
        container: 'tablaComercial',
        exportFileName: 'Presupuesto_Comercial',
        emptyMessage: 'No hay datos cargados todavía',
        onEdit: onEdit,
        onChange: (row) => onChange(row),
        columns: [
            { key: 'linea', label: 'Línea N1', type: 'text', filterable: true },
            { key: 'year', label: 'Año', type: 'text', filterable: true },
            { key: 'nombre_centro_de_operacion', label: 'Centro de operación', type: 'text', filterable: true },
            { key: 'nombre_clase_cliente', label: 'Clase cliente', type: 'text', filterable: true },
            { key: 'ventas', label: 'Ventas', type: 'money' },
            { key: 'costos', label: 'Costos', type: 'money' },
            { key: 'variacion_porcentual_ventas', label: 'Variación % ventas', type: 'percent' },
            { key: 'variacion_valor_ventas', label: 'Variación ventas $', type: 'money', visible: false },
            { key: 'variacion_valor_costos', label: 'Variación costos $', type: 'money', visible: false },
            { key: 'variacion_mes_ventas', label: 'Variación mes ventas $', type: 'money', visible: false },
            { key: 'variacion_mes_costos', label: 'Variación mes costos $', type: 'money', visible: false },
            { key: 'variacion_precios_ventas', label: 'Variación precios ventas $', type: 'money', visible: false },
            { key: 'variacion_precios_costos', label: 'Variación precios costos $', type: 'money', visible: false },
            { key: 'crecimiento_ventas', label: 'Crecimiento ventas proyectado', type: 'percent', editable: soloAnioActual },
            { key: 'proyeccion_ventas', label: 'Proyección ventas', type: 'money' },
            { key: 'utilidad_porcentual', label: 'Margen proyectado %', type: 'percent' },
            { key: 'utilidad_valor', label: 'Margen valor proyectado $', type: 'money' },
            { key: 'utilidad_porcentual_actual', label: 'Margen actual %', type: 'percent' },
            { key: 'utilidad_valor_actual', label: 'Margen valor actual $', type: 'money' },
            { key: 'variacion_proyectada_porcentual', label: 'Variación %', type: 'percent' },
            { key: 'variacion_proyectada_valor', label: 'Variación $', type: 'money' },
        ],
    });

    async function cargarDatos(conIndicador = true) {
        const traer = async () => {
            const datos = await PresupuestoUtils.getJSON("{% url 'obtener_presupuesto_comercial' %}");
            tabla.setData(datos);
        };
        if (!conIndicador) return traer();
        await PresupuestoUtils.conLoader('tablaComercial', 'Cargando presupuesto comercial…', traer);
    }

    document.getElementById('exportarBaseBtn').addEventListener('click', function () {
        window.location.href = "{% url 'exportar_crecimiento_ventas' %}";
    });

    document.getElementById('exportarExcelBtn').addEventListener('click', () => tabla.exportToExcel());

    document.getElementById('colvisBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        tabla.toggleColumnVisibilityMenu(this);
    });

    // 📤 Subida de Excel con crecimientos proyectados
    document.getElementById('uploadExcelBtn').addEventListener('click', () => document.getElementById('excelUpload').click());
    document.getElementById('excelUpload').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['xls', 'xlsx'].includes(ext)) {
            alert('❌ Solo se permiten archivos Excel (.xls o .xlsx)');
            return;
        }
        const btn = document.getElementById('uploadExcelBtn');
        const formData = new FormData();
        formData.append('file', file);

        PresupuestoUtils.withSpinner(btn, async () => {
            const res = await fetch("{% url 'importar_crecimiento_ventas' %}", {
                method: 'POST',
                headers: { 'X-CSRFToken': "{{ csrf_token }}" },
                body: formData,
            });
            const texto = await res.text();
            let data;
            try { data = JSON.parse(texto); } catch (err) { data = { mensaje: texto }; }
            if (!res.ok) throw new Error(data.mensaje || data.error || 'Error al procesar el archivo');
            alert('✅ ' + data.mensaje);
            await cargarDatos();
            programarVentas(500);      // los crecimientos cambiaron: recalcular el presupuesto de ventas
        }).catch(err => alert('❌ Error al procesar el archivo:\n' + err.message))
          .finally(() => { e.target.value = ''; });
    });

    cargarDatos().then(revisarRespaldo).catch(err => {
        console.error(err);
        mostrarEstado('❌ No se pudieron cargar los datos; recarga la página en unos segundos', 'error');
    });
});
</script>
{% endblock %}
