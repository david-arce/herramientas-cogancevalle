{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Presupuesto aprobado · {{ sede_label }}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    :root { --color-primario: #1F3A93; --color-borde: #d7d9dc; --color-fondo-header: #f8f9fa; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 16px; }
    h2 { margin-bottom: 4px; }
    .subtitulo { color: #666; font-size: 14px; margin: 0 0 14px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; align-items: center; }
    .toolbar-group {
        display: flex; align-items: center; gap: 8px; padding: 8px;
        border: 1px solid var(--color-borde); border-radius: 6px; background: var(--color-fondo-header);
    }
    .toolbar-group button {
        font-size: 14px; padding: 6px 14px; border: none; border-radius: 6px;
        cursor: pointer; background: #5e5e5e; color: #fff; transition: all .2s ease;
    }
    .toolbar-group button:hover { background: #8b8b8b; color: #111; }
    #gridContainer { overflow: auto; max-width: 100%; height: 70vh; border: 1px solid var(--color-borde); }
    table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
    table.grid th, table.grid td {
        border: 1px solid var(--color-borde); padding: 5px 10px; white-space: nowrap; text-align: left;
    }
    table.grid thead th { background: var(--color-primario); color: #fff; position: sticky; top: 0; z-index: 2; }
    td.numeric { text-align: right; font-variant-numeric: tabular-nums; }
    #gridBody tr:nth-child(even) { background: #fafafa; }
    #gridBody tr:hover { background: #eef2fb; }
    table.grid tfoot td {
        position: sticky; bottom: 0; z-index: 2;
        background: #e8ecf7; color: var(--color-primario); font-weight: 700;
        border-top: 2px solid var(--color-primario);
    }
    table.grid tfoot td.total-general { background: var(--color-primario); color: #fff; }
    .aviso { font-size: 13px; color: #155724; background: #e9f9ee; border: 1px solid #b7ecc5;
             padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; }
</style>
</head>
<body>
<h2>Presupuesto {{ sede_label }} — aprobado</h2>
<p class="subtitulo">Solo lectura. Para cambiar algo, edita y vuelve a aprobar la versión desde la pantalla de revisión.</p>

<div class="aviso">Versión aprobada vigente: <b>v{{ ultima_version }}</b></div>

<div class="toolbar">
    <div class="toolbar-group">
        <a href="{% url 'presupuesto_sede' sede=sede %}"><button type="button">↩️ Volver a revisión</button></a>
        <button id="exportarExcelBtn">📥 Exportar a Excel</button>
    </div>
</div>

<div id="gridContainer">
    <table class="grid" id="gridTable">
        <thead><tr id="gridHeaderRow"></tr></thead>
        <tbody id="gridBody"></tbody>
        <tfoot><tr id="gridFooterRow"></tr></tfoot>
    </table>
</div>

<script>
const SEDE = "{{ sede }}";
const URL_OBTENER = "{% url 'obtener_presupuesto_aprobado_sede' sede=sede %}";

const MESES = ["enero","febrero","marzo","abril","mayo","junio",
               "julio","agosto","septiembre","octubre","noviembre","diciembre"];

const COLUMNS = [
    { key: "centro_tra", label: "Centro trabajo" },
    { key: "nombre_cen", label: "Nombre centro" },
    { key: "codcosto", label: "Código costo" },
    { key: "responsable", label: "Responsable" },
    { key: "cuenta", label: "Cuenta" },
    { key: "cuenta_mayor", label: "Cuenta Mayor" },
    { key: "detalle_cuenta", label: "Detalle Cuenta" },
    { key: "sede_distribucion", label: "Sede distribución" },
    { key: "proveedor", label: "Proveedor" },
    ...MESES.map(m => ({ key: m, label: m[0].toUpperCase() + m.slice(1), type: "number" })),
    { key: "total", label: "Total", type: "number" },
    { key: "comentario", label: "Comentario" },
];

let rows = [];

function fmt(n) {
    if (n === null || n === undefined || n === "" || isNaN(n)) return n ?? "";
    return new Intl.NumberFormat('es-ES').format(n);
}
function escaparHtml(t) {
    const d = document.createElement("div");
    d.textContent = String(t ?? "");
    return d.innerHTML;
}

function renderHeader() {
    document.getElementById("gridHeaderRow").innerHTML =
        COLUMNS.map(c => `<th>${escaparHtml(c.label)}</th>`).join("");
}
function renderTotales() {
    const fila = document.getElementById("gridFooterRow");
    if (!rows.length) { fila.innerHTML = ""; return; }
    const sumas = {};
    COLUMNS.forEach(c => { if (c.type === "number") sumas[c.key] = 0; });
    rows.forEach(r => { for (const k in sumas) sumas[k] += parseFloat(r[k]) || 0; });
    fila.innerHTML = COLUMNS.map((col, i) => {
        if (i === 0) return `<td>TOTAL · ${rows.length} fila${rows.length === 1 ? "" : "s"}</td>`;
        if (col.type === "number") {
            const clase = col.key === "total" ? "numeric total-general" : "numeric";
            return `<td class="${clase}">${fmt(sumas[col.key])}</td>`;
        }
        return "<td></td>";
    }).join("");
}

function render() {
    renderTotales();
    const tbody = document.getElementById("gridBody");
    if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${COLUMNS.length}" style="text-align:center; padding:20px; color:#888;">Todavía no hay un presupuesto aprobado.</td></tr>`;
        return;
    }
    tbody.innerHTML = rows.map(row => `<tr>` + COLUMNS.map(col => {
        const clase = col.type === "number" ? ' class="numeric"' : "";
        const texto = col.type === "number" ? fmt(row[col.key]) : (row[col.key] ?? "");
        return `<td${clase}>${escaparHtml(texto)}</td>`;
    }).join("") + `</tr>`).join("");
}

async function cargarDatos() {
    try {
        const res = await fetch(URL_OBTENER);
        const resp = await res.json();
        rows = resp.data || [];
        render();
    } catch (e) {
        document.getElementById("gridBody").innerHTML =
            `<tr><td colspan="${COLUMNS.length}" style="text-align:center; padding:20px; color:#c00;">Error al cargar los datos</td></tr>`;
    }
}

document.getElementById("exportarExcelBtn").addEventListener("click", () => {
    const encabezados = COLUMNS.map(c => c.label);
    const datos = rows.map(r => COLUMNS.map(c => r[c.key] ?? ""));
    const ws = XLSX.utils.aoa_to_sheet([encabezados, ...datos]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Presupuesto");
    XLSX.writeFile(wb, `presupuesto_${SEDE}_aprobado.xlsx`);
});

renderHeader();
cargarDatos();
</script>
</body>
</html>
